<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>kb graph serve</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #151823;
        --fg: #e6e6ea;
        --muted: #8a8fa3;
        --source: #4f86ff;
        --concept: #3ec989;
        --candidate: #e3c348;
        --stale: #8a8fa3;
        --edge: rgba(180, 185, 200, 0.35);
        --edge-highlight: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        padding: 10px 16px; background: rgba(15,17,23,0.85); backdrop-filter: blur(6px);
        border-bottom: 1px solid #222634;
        display: flex; gap: 16px; align-items: center; justify-content: space-between;
      }
      header h1 { margin: 0; font-size: 14px; letter-spacing: 0.02em; font-weight: 600; }
      header .meta { color: var(--muted); font-size: 12px; }
      .legend { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); }
      .legend span { display: inline-flex; align-items: center; gap: 4px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      #graph { width: 100vw; height: 100vh; display: block; cursor: default; }
      #tooltip {
        position: fixed; pointer-events: none; background: var(--panel); color: var(--fg);
        padding: 8px 10px; border-radius: 6px; border: 1px solid #2a2f42;
        font-size: 12px; max-width: 320px; display: none; z-index: 20;
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      }
      #tooltip h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; }
      #tooltip .kind { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
      #tooltip ul { margin: 4px 0 0; padding-left: 16px; }
      #status { position: fixed; bottom: 10px; left: 12px; color: var(--muted); font-size: 11px; z-index: 10; }
      #status .dot.live { background: var(--concept); animation: pulse 1.4s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
    </style>
  </head>
  <body>
    <header>
      <h1>kb graph serve</h1>
      <div class="legend">
        <span><i class="dot" style="background:var(--source)"></i>source</span>
        <span><i class="dot" style="background:var(--concept)"></i>concept</span>
        <span><i class="dot" style="background:var(--candidate)"></i>candidate</span>
        <span><i class="dot" style="background:var(--stale)"></i>stale</span>
      </div>
      <div class="meta" id="meta">loading…</div>
    </header>
    <svg id="graph"></svg>
    <div id="tooltip"></div>
    <div id="status"><i class="dot live"></i> <span id="status-text">connecting…</span></div>

    <script src="/assets/force.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
